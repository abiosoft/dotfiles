# ==============================================================================
# 1. CORE & ENVIRONMENT SETTINGS
# ==============================================================================

# Terminal color & escape timings
set -g default-terminal "screen-256color"
set -sg escape-time 20

# Set custom default shell & clipboard integration
set -g default-shell ~/bin/myzsh
set -g set-clipboard on

# Enable mouse support & disable default right-click context menu
set -g mouse on
unbind -n MouseDown3Pane


# ==============================================================================
# 2. KEY BINDINGS & NAVIGATION
# ==============================================================================

# Enable secondary prefix (Ctrl+n)
set-option -g prefix2 C-n

# Use Vi keys in copy mode & pane navigation
setw -g mode-keys vi
setw -g xterm-keys on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Custom script & session shortcuts
bind s run-shell "~/dotfiles/bin/switch.sh"
bind w run-shell "~/dotfiles/bin/switch-win.sh"
bind r send-keys -t 1 r enter


# ==============================================================================
# 3. APPEARANCE & STATUS BAR (NESTED - BOTTOM)
# ==============================================================================

# Keep status line at bottom (default for inner session)
set -g status-position bottom

# Default local status bar theme & borders
set -g status-style bg="#3d3f43",fg="#c5c8c6"
set -g pane-border-style fg="#555555"
set -g pane-active-border-style fg="#aaaaaa"

# Default right status readout
set -g status-right "%I:%M %p %d %b | #(hostname) "

# SSH Session Override (Changes theme when active inside SSH)
if-shell '[ -n "$SSH_CONNECTION" ]' {
    set -g status-style bg="#152015",fg="#c4c4c4"
    set -g status-right "%I:%M %p %d %b | ssh:#(hostname) "
}

# ==============================================================================
# COLOR REFERENCE PALETTE
# ==============================================================================
# #1d1f21 Background  | #282a2e Current Line | #373b41 Selection
# #c5c8c6 Foreground  | #969896 Comment      | #cc6666 Red
# #de935f Orange      | #f0c674 Yellow       | #b5bd68 Green
# #8abeb7 Aqua        | #81a2be Blue         | #b294bb Purple
