# ==============================================================================
# 1. CORE & ENVIRONMENT SETTINGS
# ==============================================================================

# Terminal color & escape timings
set -g default-terminal "screen-256color"
set -sg escape-time 20

# Strip TMUX environment variable to allow clean nested tmux sessions
set -g default-command "env -u TMUX $SHELL"
set -g set-clipboard on

# Enable mouse support & disable default right-click context menu
set -g mouse on
unbind -n MouseDown3Pane


# ==============================================================================
# 2. KEY BINDINGS & NAVIGATION
# ==============================================================================

# Use Vi keys in copy mode & pane navigation
setw -g mode-keys vi
setw -g xterm-keys on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Open new tab directly with Alt+t
bind-key -n M-t new-window


# ==============================================================================
# 3. TABBED BAR & TRANSPARENT UI
# ==============================================================================

# Move status bar to top & set alignment to left
set -g status-position top

# Transparent status bar with a solid horizontal underline (border bottom effect)
set -g status-style bg=default,fg="#c5c8c6",underscore,us="#555555"
set -g pane-border-style fg="#555555"
set -g pane-active-border-style fg="#aaaaaa"

# Prevent tmux from renaming windows automatically
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Active Tab Styling (" tab-#I " format - un-underscored so tab background stays clean)
setw -g window-status-current-style bg="#3d3f43",fg="#ffffff",bold,nounderscore
setw -g window-status-current-format " tab-#I "

# Inactive Tab Styling (" tab-#I " format)
setw -g window-status-style bg="#282a2e",fg="#8a8a8a",nounderscore
setw -g window-status-format " tab-#I "

# Tab Separator
setw -g window-status-separator " "

# Left & Right Readouts
set -g status-right-length 20
set -g status-right "#[fg=#aaaaaa,bg=default,underscore]%I:%M %p "
