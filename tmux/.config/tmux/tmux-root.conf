# ==============================================================================
# 1. CORE & ENVIRONMENT SETTINGS
# ==============================================================================

# Terminal color & escape timings
set -g default-terminal "screen-256color"
set -sg escape-time 20

# Strip TMUX environment variable to allow clean nested tmux sessions
set -g default-command "env -u TMUX $SHELL"
set -g set-clipboard on

# Enable mouse support & disable default right-click context menu
set -g mouse on
unbind -n MouseDown3Pane


# ==============================================================================
# 2. KEY BINDINGS & NAVIGATION
# ==============================================================================

# Use Vi keys in copy mode & pane navigation
setw -g mode-keys vi
setw -g xterm-keys on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Open new tab directly with Alt+t
bind-key -n M-t new-window


# ==============================================================================
# 3. TABBED BAR & TRANSPARENT UI
# ==============================================================================

# Move status bar to top & set alignment to left
set -g status-position top

# Transparent status bar base with a unified foreground (#555555)
set -g status-style bg=default,fg="#555555"
set -g pane-border-style fg="#555555"
set -g pane-active-border-style fg="#aaaaaa"

# Prevent tmux from renaming windows automatically
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Active Tab Styling (Distinct background #3d3f43, fg color #bbbbbb)
setw -g window-status-current-style bg="#3d3f43",fg="#bbbbbb",bold
setw -g window-status-current-format "   #I   "

# Inactive Tab Styling (Slightly dimmer background #282a2e, fg color #555555)
setw -g window-status-style bg="#282a2e",fg="#555555"
setw -g window-status-format "   #I   "

# Tab Separator
setw -g window-status-separator " "

# --- CLICKABLE PLUS BUTTON IN STATUS-RIGHT ---

# Combine [+] button (matching bg & fg) and time readout with fg #555555
set -g status-right-length 40
set -g status-right "#[fg=#bbbbbb,bg=#3d3f43,bold] + #[bg=default]#[fg=#555555]  %I:%M %p "

# Bind left-click on status-right to create a new window
bind-key -n MouseDown1StatusRight new-window
